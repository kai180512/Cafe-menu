<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>架空のカフェメニュー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

 <div class="flex gap-3">

  <p class="text-grey-700 text-center text-sm font-bold hover:text-blue-800">珈琲</p>
  <img src="./img/coffee.png" alt="COFFEE" class="object-cover w-full block mx-auto">
  <p class="text-center text-sm text-green-500">¥400</p>
  <p class="text-center text-sm text-gray-700">ホット/ アイス</p>
 </div>
 <div class="bg-white rounded-lg w-40 flex-1 shadow">
  <p class="text-grey-700 text-center text-sm font-bold hover:text-blue-800">煎茶</p>

  <p class="text-center text-sm text-green-500 mt-3">¥550</p>
 </div> 
<div class="bg-white rounded-lg w-40 flex-1 shadow">
  <p class="text-grey-700 text-center text-sm font-bold hover:text-blue-800">残響</p>
  <img src="./img/Reverberation.png" alt="酒" class="object-cover w-full aspect-square">

</div>
</div>
 <p class="text-xl font-bold text-center mb-3">FOOD MENU</p>
 <div class="flex gap-3">
 <div class="bg-white rounded-lg w-40 flex-1 mx-auto shadow">

 <img src="./img/sandwich_transparent.png" alt="サンドイッチ" class="object-cover w-full aspect-square">
 <p class="text-center text-sm text-green-500">¥700</p>
 </div>
<div class="bg-white rounded-lg w-40 flex-1 mx-auto shadow">
 <p class="text-grey-700 text-center text-sm font-bold hover:text-blue-800">ステーキ</p>
 <img src="./img/steak.png" alt="ステーキ" class="object-cover w-full aspect-square mx-auto block">
 <p class="text-center text-sm text-green-500">¥1800</p>
 </div>
 <div class="bg-white rounded-lg w-40 flex-1 mx-auto shadow">
 <p class="text-grey-700 text-center text-sm font-bold hover:text-blue-800">サンデーサンデー</p>
 <img src="./img/pafe.png" alt="サンデーサンデー" class="object-cover w-full aspect-square">
 <p class="text-center text-sm text-green-500">¥1350</p>
 </div>
